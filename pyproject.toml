[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-ad"
version = "1.5.0"
description = "Quantifying clinical and genetic contributions to cognitive risk prediction"
requires-python = ">=3.8"
dependencies = ["numpy>=1.22", "pandas>=1.3"]
authors = [{name = "Yulin Dai"}, {name = "Cassidy S. Wood"}, {name = "Xiaoqian Jiang"}, {name = "Yu-Chun Hsu", email = "Yu-Chun.Hsu@uth.tmc.edu"}]

[project.optional-dependencies]
figures = ["matplotlib>=3.5", "Pillow>=9"]
analysis = ["scipy>=1.7", "statsmodels>=0.13", "scikit-learn>=1.0", "pyarrow>=25"]
models = ["scipy>=1.7", "statsmodels>=0.13", "scikit-learn>=1.0", "torch>=2.6", "pyarrow>=25", "tabpfn==8.2.0"]

[project.urls]
Repository = "https://github.com/davidroad/prismAD"

[project.scripts]
prism-ad = "prism_ad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
